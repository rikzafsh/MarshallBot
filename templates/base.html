<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MarshallBot{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo-mark.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body{% block body_attr %}{% endblock %}>
  <header class="topbar">
    {% block brand %}
    <a class="brand" href="{{ url_for('index') }}" aria-label="MARSHALL, Kalender Jawa Mataraman Berbasis Web (beranda)">
      <img src="{{ url_for('static', filename='img/logo-header.png') }}" alt="MARSHALL">
    </a>
    {% endblock %}
    <nav class="topbar-nav">{% block nav %}{% endblock %}</nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="footer">
    Mars Shadow Excellent Calendar Bot. Berbasis aturan dan pola, tanpa model bahasa besar.
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
